<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✏️ [국어] 소리의 변동 형성평가 (2차시)</title>
  <style>
    :root {
      --primary: #1E3A8A;
      --primary-light: #EFF6FF;
      --success: #15803D;
      --success-bg: #DCFCE7;
      --error: #B91C1C;
      --error-bg: #FEE2E2;
      --border: #CBD5E1;
      --text: #1E293B;
      --gray: #64748B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background-color: #F8FAFC;
      color: var(--text);
      line-height: 1.6;
      padding: 20px 12px;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      background: #FFFFFF;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      padding: 24px 20px;
      border: 1px solid #E2E8F0;
    }
    h1 { font-size: 1.45rem; color: var(--primary); text-align: center; margin-bottom: 8px; font-weight: 800; }
    .subtitle { text-align: center; color: var(--gray); font-size: 0.92rem; margin-bottom: 22px; }
    .card {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 18px;
    }
    .badge {
      display: inline-block;
      background: #E2E8F0;
      color: #334155;
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .q-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 14px; line-height: 1.5; }
    label { font-weight: 600; font-size: 0.95rem; display: block; margin-bottom: 6px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.98rem;
      transition: border 0.2s;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn:hover { background: #172554; }
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #334155; }
    .btn-outline { background: white; color: var(--primary); border: 1.5px solid var(--primary); }
    .btn-outline:hover { background: var(--primary-light); }
    .radio-group { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
    .radio-item {
      display: flex;
      align-items: flex-start;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      background: white;
      font-size: 0.95rem;
    }
    .radio-item:hover { background: var(--primary-light); }
    .radio-item input { margin-top: 4px; margin-right: 10px; cursor: pointer; }
    .progress-bar-bg {
      background: #E2E8F0;
      border-radius: 999px;
      height: 9px;
      overflow: hidden;
      margin: 10px 0 16px;
    }
    .progress-bar-fill {
      background: var(--primary);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    .flex-between { display: flex; justify-content: space-between; font-size: 0.88rem; color: var(--gray); font-weight: 600; }
    .msg-box {
      padding: 14px;
      border-radius: 8px;
      margin-top: 14px;
      font-size: 0.95rem;
    }
    .msg-success { background: var(--success-bg); color: var(--success); border: 1px solid #86EFAC; font-weight: 700; }
    .msg-error { background: var(--error-bg); color: var(--error); border: 1px solid #FCA5A5; font-weight: 700; }
    .msg-info { background: #F0FDF4; color: #166534; border: 1px solid #BBF7D0; margin-top: 10px; line-height: 1.55; }
    .tabs { display: flex; border-bottom: 2px solid #E2E8F0; margin-bottom: 16px; gap: 6px; }
    .tab-btn {
      padding: 10px 14px;
      border: none;
      background: none;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      color: var(--gray);
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
    }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    details {
      background: white;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 0.92rem;
    }
    summary { font-weight: 700; cursor: pointer; color: #1E3A8A; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <h1>✏️ [국어] 소리의 변동 형성평가 (2차시)</h1>
  <div class="subtitle">교과서 90~93쪽 핵심 원리 37문항 완전 정복</div>

  <!-- 1. 학생 정보 입력 화면 -->
  <div id="screen-intro">
    <div class="card">
      <h3 style="margin-bottom: 10px; color: var(--primary);">👤 감일고 학생 정보 입력 (2차시)</h3>
      <p style="font-size: 0.9rem; color: var(--gray); margin-bottom: 14px;">
        학번과 이름을 정확히 입력하세요. 잘못 기재하면 참여하지 않은 것으로 처리됩니다. (총 37문항)
      </p>
      <div style="margin-bottom: 12px;">
        <label for="s_id">학번 (예: 20101)</label>
        <input type="text" id="s_id" placeholder="학번을 입력하세요" onkeypress="handleIntroEnter(event)">
      </div>
      <div style="margin-bottom: 12px;">
        <label for="s_name">이름 (예: 홍길동)</label>
        <input type="text" id="s_name" placeholder="이름을 입력하세요" onkeypress="handleIntroEnter(event)">
      </div>
      <button class="btn" onclick="startQuiz()">🚀 2차시 평가 시작하기 (Enter)</button>
      <div id="intro-warn" class="msg-box msg-error hidden" style="margin-top: 10px;">⚠️ 학번과 이름을 모두 입력해 주세요!</div>
    </div>
  </div>

  <!-- 2. 개별 문제 풀이 화면 -->
  <div id="screen-quiz" class="hidden">
    <div class="flex-between">
      <span id="display-user"></span>
      <span id="display-progress"></span>
    </div>
    <div class="progress-bar-bg">
      <div id="progress-bar" class="progress-bar-fill"></div>
    </div>

    <div class="card">
      <span id="q-category" class="badge"></span>
      <div id="q-question" class="q-title"></div>

      <!-- 단답형 입력창 -->
      <div id="box-short" class="hidden">
        <label for="short-input">정답 입력:</label>
        <input type="text" id="short-input" placeholder="답안을 입력하고 Enter를 누르세요..." onkeypress="handleQuizEnter(event)">
      </div>

      <!-- 선택형 보기 -->
      <div id="box-choice" class="hidden">
        <div id="choice-options" class="radio-group"></div>
      </div>

      <button id="btn-check" class="btn" onclick="checkCurrentAnswer()">🔍 정답 확인 (Enter)</button>

      <!-- 피드백 & 해설창 -->
      <div id="feedback-result" class="hidden">
        <div id="msg-feedback" class="msg-box"></div>
        <div id="msg-explanation" class="msg-box msg-info"></div>
        <button id="btn-next" class="btn" onclick="goToNextQuestion()" style="margin-top: 12px;">➡️ 다음 문제로 이동 (Enter)</button>
      </div>
      <div id="lock-msg" class="hidden" style="text-align: center; color: var(--gray); font-size: 0.85rem; margin-top: 10px;">
        🔒 정답을 맞혀야 다음 문제로 넘어갈 수 있습니다.
      </div>
    </div>
  </div>

  <!-- 3. 최종 완료 화면 -->
  <div id="screen-result" class="hidden">
    <div style="text-align: center; margin-bottom: 20px;">
      <h2 style="color: var(--primary);" id="result-title">🎉 2차시 평가 완료!</h2>
      <h3 style="margin-top: 6px; font-size: 1.15rem;" id="result-score"></h3>
      <p style="font-size: 0.9rem; color: var(--gray); margin-top: 4px;">평가 결과는 <b>구글 시트 [2차시] 기록부에 자동 저장</b>되었습니다.</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab(1)">📊 나의 결과 & 오답노트</button>
      <button class="tab-btn" onclick="switchTab(2)">📚 전체 37문항 다시 복습하기</button>
    </div>

    <div id="tab-content-1">
      <div id="wrong-summary-box" class="card"></div>
      <button id="btn-retry-wrong" class="btn btn-outline hidden" onclick="startRetryWrong()">🔥 처음 틀렸던 문제만 오답노트로 다시 풀기</button>
      <button class="btn btn-secondary" onclick="resetFullQuiz()" style="margin-top: 10px;">🔄 처음부터 전체 문제 다시 시작하기</button>
    </div>

    <div id="tab-content-2" class="hidden">
      <div style="font-size: 0.9rem; color: var(--gray); margin-bottom: 12px;">
        💡 전체 37개 문항을 자율적으로 복습하고, [정답 및 해설]을 열어 정답을 확인하세요.
      </div>
      <div id="all-questions-list"></div>
    </div>
  </div>
</div>

<script>
  // 🚫 [보안] F12 및 우클릭(개발자 도구 / 소스 보기) 차단
  document.addEventListener('keydown', function(e) {
    if (
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key)) ||
      (e.ctrlKey && (e.key === 'U' || e.key === 'u'))
    ) {
      e.preventDefault();
      return false;
    }
  });

  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
  });

  // 🚨 개발자 도구를 억지로 열었을 때 무한 일시정지(Debugger) 트랩
  setInterval(function() {
    debugger;
  }, 100);
  
  // 🔗 [설정] 2차시 구글 시트 배포 URL, 탭 이름
  const GOOGLE_SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbymuGKCOqviCjqn3PEab4ubtf_m5cf1Gj184kGTgFqm0nBrOSKX7_oc9V_Wjv73AbGTAA/exec";
  const SHEET_TAB_NAME = "2차시";

  // 📚 2차시 37문항 데이터베이스
  const RAW_QUIZ_DATA = {
    "1. 소리의 동화 (구개음화, 비음화, 유음화)": [
      { id: 1, type: "short", question: "음운과 음운이 만날 때, 한 음운이 다른 음운의 영향을 받아 그와 같거나 비슷하게 소리 나는 현상을 [     ]라 한다. 빈칸에 들어갈 올바른 개념을 쓰시오.", answer: "동화", explanation: "한 음운이 인접한 다른 음운의 영향을 받아 비슷하거나 동일하게 바뀌는 음운 변동 현상을 '동화'라고 합니다." },
      { id: 2, type: "choice", question: "'구개음화'에 대한 설명으로 올바른 것을 고르시오.", options: ["1. 'ㄷ, ㅌ'이 조사나 접미사의 모음 'ㅣ'를 만나 각각 [ㅈ, ㅊ]으로 바뀌는 현상이다.", "2. 'ㄷ, ㅌ'이 실질 형태소의 모음 'ㅣ'를 만날 때 일어난다."], answer: "1. 'ㄷ, ㅌ'이 조사나 접미사의 모음 'ㅣ'를 만나 각각 [ㅈ, ㅊ]으로 바뀌는 현상이다.", explanation: "구개음화는 받침 'ㄷ, ㅌ'이 모음 'ㅣ'나 반모음 'j'로 시작하는 '형식 형태소(조사, 접미사)'를 만날 때 [ㅈ, ㅊ]으로 바뀌어 뒤 음절 첫소리로 옮겨 발음되는 현상입니다." },
      { id: 3, type: "short", question: "'밭이'의 올바른 표준 발음을 쓰시오.", answer: ["바치", "[바치]"], explanation: "받침 'ㅌ' 뒤에 모음 'ㅣ'로 시작하는 조사(형식 형태소) '-이'가 결합하였으므로, 구개음화가 적용되어 [바치]로 발음합니다." },
      { id: 4, type: "choice", question: "'닫히다'의 표준 발음 과정을 바르게 설명한 것을 고르시오.", options: ["1. 'ㄷ'과 'ㅎ'이 만나 거센소리 [ㅌ]이 된 후, 모음 'ㅣ'를 만나 구개음화 [치]로 발음된다.", "2. 'ㄷ'이 먼저 구개음화가 일어나 [지]가 된 후 'ㅎ'과 합쳐진다."], answer: "1. 'ㄷ'과 'ㅎ'이 만나 거센소리 [ㅌ]이 된 후, 모음 'ㅣ'를 만나 구개음화 [치]로 발음된다.", explanation: "'닫히다'는 거센소리되기(축약)로 [다티다]가 된 후, 'ㅌ'이 'ㅣ'를 만나 구개음화가 일어나 최종 [다치다]로 발음됩니다." },
      { id: 5, type: "choice", question: "다음 중 '비음화'가 일어난 예시로만 짝지어진 것은?", options: ["1. 굳이[구지], 신라[실라]", "2. 국물[궁물], 닫는[단는], 밥만[밤만]"], answer: "2. 국물[궁물], 닫는[단는], 밥만[밤만]", explanation: "받침 'ㄱ, ㄷ, ㅂ'이 비음 'ㄴ, ㅁ' 앞에서 각각 비음인 [ㅇ, ㄴ, ㅁ]으로 바뀌어 소리 나는 현상을 '비음화'라고 합니다." },
      { id: 6, type: "choice", question: "'ㄹ의 비음화'에 대한 설명으로 알맞은 것을 고르시오.", options: ["1. 받침 'ㅁ, ㅇ' 뒤에 연결되는 'ㄹ'은 [ㄹ] 소리를 유지한다.", "2. 받침 'ㅁ, ㅇ' 또는 'ㄱ, ㅂ' 뒤에 연결되는 'ㄹ'은 [ㄴ]으로 발음된다."], answer: "2. 받침 'ㅁ, ㅇ' 또는 'ㄱ, ㅂ' 뒤에 연결되는 'ㄹ'은 [ㄴ]으로 발음된다.", explanation: "받침 'ㅁ, ㅇ' 뒤 또는 'ㄱ, ㅂ' 뒤에 오는 'ㄹ'은 비음 [ㄴ]으로 바뀝니다. (예: 담력[담녁], 강릉[강능], 협력[협녁→혐녁])" },
      { id: 7, type: "choice", question: "'유음화'의 원리로 올바른 것을 고르시오.", options: ["1. 'ㄴ'은 'ㄹ'의 앞이나 뒤에서 [ㄹ]로 발음된다.", "2. 'ㄹ'은 'ㄴ'의 앞이나 뒤에서 [ㄴ]으로 발음된다."], answer: "1. 'ㄴ'은 'ㄹ'의 앞이나 뒤에서 [ㄹ]로 발음된다.", explanation: "'ㄴ'이 유음 'ㄹ'을 앞이나 뒤에서 만나 [ㄹ]로 바뀌어 발음되는 현상을 '유음화'라고 합니다. (예: 신라[실라], 칼날[칼랄])" },
      { id: 8, type: "short", question: "예외 규정: 한자어 중 '생산량'과 '결단력'의 올바른 표준 발음을 순서대로 적으시오. (쉼표로 구분)", answer: ["생산냥, 결딴녁", "생산냥,결딴녁", "[생산냥], [결딴녁]", "[생산냥],[결딴녁]"], explanation: "일반적으로 'ㄴ'과 'ㄹ'이 만나면 유음화되지만, 일부 한자어 합성어에서는 뒤의 'ㄹ'이 [ㄴ]으로 발음되는 예외가 있습니다." },
      { id: 9, type: "short", question: "[바탕다지기] 문장의 밑줄 친 부분의 표준 발음을 순서대로 적으시오(쉼표로 구분): '이 밭은([ 1 ]) 누가 관리([ 2 ])해야 하는 밭인지([ 3 ]) 협상했다.'", answer: ["바튼, 괄리, 바친지", "바튼,괄리,바친지", "[바튼], [괄리], [바친지]", "바튼괄리바친지"], explanation: "'발은'은 연음되어 [바튼], '관리'는 유음화로 [괄리], '바친지'는 연음된 후 구개음화에 의해 [바친지]로 발음합니다." },
      { id: 10, type: "short", question: "[바탕다지기] 다음 문장 빈칸의 표준 발음을 적으시오: '이번에 제정된 대통령령([     ])을 발표하겠습니다.'", answer: ["대통녕녕", "[대통녕녕]"], explanation: "'대통령'에서 'ㅇ+ㄹ' 비음화로 [대통녕]이 되며, 뒤의 '령' 역시 비음화되어 최종적으로 [대:통녕녕]으로 발음됩니다." },
      { id: 11, type: "short", question: "[바탕다지기] 다음 문장 빈칸의 표준 발음을 적으시오: '층간 소음을 방지하기 위해 실내화([     ])를 신어야 합니다.'", answer: ["실래화", "[실래화]"], explanation: "'ㄹ+ㄴ' 유음화 조건에 따라 [실래화]로 발음하는 것이 올바른 표준 발음입니다." },

      { id: 33, type: "short", question: "다음 단어의 표준 발음을 순서대로 적으시오: '닳는', '핥네' (쉼표로 구분)", answer: ["달른, 할레", "달른,할레", "[달른], [할레]", "[달른],[할레]", "달른할레"], explanation: "‘닳는’은 ‘ㅎ’이 탈락하고 앞의 유음 ‘ㄹ’에 의해 뒤의 비음 ‘ㄴ’이 유음화되어 [달른]으로 발음합니다. ‘핥네’ 역시 겹받침 단순화 및 유음화 과정을 거쳐 최종 [할레]로 발음합니다." },

  // 상태 변수
  let studentId = "";
  let studentName = "";
  let activeQuizList = [];
  let currentIndex = 0;
  let firstAttemptStatus = {};
  let wrongQuestions = [];
  let sheetSubmitted = false;

  function cleanText(text) {
    if (Array.isArray(text)) return text.map(t => cleanText(t));
    return text.toString().replace(/\s+/g, "").replace(/\[|\]/g, "").replace(/\./g, ",").replace(/\//g, ",");
  }

  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function initQuizData() {
    let list = [];
    for (const [category, items] of Object.entries(RAW_QUIZ_DATA)) {
      const shuffledCat = shuffle(items);
      shuffledCat.forEach(item => {
        list.push({ ...item, category: category });
      });
    }
    activeQuizList = list;
    currentIndex = 0;
    firstAttemptStatus = {};
    wrongQuestions = [];
    sheetSubmitted = false;
  }

  // 1. 시작 화면
  function handleIntroEnter(e) {
    if (e.key === "Enter") startQuiz();
  }

  function startQuiz() {
    const idVal = document.getElementById("s_id").value.trim();
    const nameVal = document.getElementById("s_name").value.trim();

    if (!idVal || !nameVal) {
      document.getElementById("intro-warn").classList.remove("hidden");
      return;
    }
    studentId = idVal;
    studentName = nameVal;

    initQuizData();
    document.getElementById("screen-intro").classList.add("hidden");
    document.getElementById("screen-quiz").classList.remove("hidden");
    renderCurrentQuestion();
  }

  // 2. 문제 렌더링
  function renderCurrentQuestion() {
    const q = activeQuizList[currentIndex];
    const total = activeQuizList.length;

    document.getElementById("display-user").innerHTML = `👤 <b>학생:</b> ${studentName} (${studentId})`;
    document.getElementById("display-progress").innerHTML = `🎯 <b>진행:</b> ${currentIndex + 1} / ${total} 문항`;
    document.getElementById("progress-bar").style.width = `${((currentIndex + 1) / total) * 100}%`;

    document.getElementById("q-category").innerText = `📌 ${q.category}`;
    document.getElementById("q-question").innerText = `Q${currentIndex + 1}. ${q.question}`;

    document.getElementById("btn-check").classList.remove("hidden");
    document.getElementById("feedback-result").classList.add("hidden");
    document.getElementById("lock-msg").classList.add("hidden");

    const boxShort = document.getElementById("box-short");
    const boxChoice = document.getElementById("box-choice");
    const shortInput = document.getElementById("short-input");

    if (q.type === "short") {
      boxShort.classList.remove("hidden");
      boxChoice.classList.add("hidden");
      shortInput.value = "";
      shortInput.disabled = false;
      setTimeout(() => shortInput.focus(), 50);
    } else {
      boxShort.classList.add("hidden");
      boxChoice.classList.remove("hidden");
      const optContainer = document.getElementById("choice-options");
      optContainer.innerHTML = "";
      q.options.forEach((opt, idx) => {
        const item = document.createElement("label");
        item.className = "radio-item";
        item.innerHTML = `
          <input type="radio" name="quiz_opt" value="${opt}" id="opt_${idx}">
          <span>${opt}</span>
        `;
        optContainer.appendChild(item);
      });
    }
  }

  // 단답형 및 다음 문제 이동 시 엔터키 처리
  function handleQuizEnter(e) {
    if (e.key === "Enter") {
      const feedbackHidden = document.getElementById("feedback-result").classList.contains("hidden");
      if (feedbackHidden) {
        checkCurrentAnswer();
      }
    }
  }

  // 전역 엔터키 감지: 통과 후 '다음 문제로 이동' 엔터 처리
  document.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      const btnNext = document.getElementById("btn-next");
      const feedback = document.getElementById("feedback-result");
      if (!feedback.classList.contains("hidden") && !btnNext.classList.contains("hidden")) {
        // 단답형 input 포커스로 인한 중복 이벤트 방지
        if (document.activeElement.id !== "short-input") {
          goToNextQuestion();
        }
      }
    }
  });

  // 3. 정답 검증 로직
  function checkCurrentAnswer() {
    const q = activeQuizList[currentIndex];
    let userAns = "";

    if (q.type === "short") {
      userAns = document.getElementById("short-input").value.trim();
    } else {
      const selected = document.querySelector('input[name="quiz_opt"]:checked');
      if (selected) userAns = selected.value;
    }

    if (!userAns) {
      alert("⚠️ 먼저 정답을 입력하거나 선택해 주세요.");
      return;
    }

    let isCorrect = false;
    if (q.type === "short") {
      const cleanedUser = cleanText(userAns);
      const cleanedCorrect = cleanText(q.answer);
      if (Array.isArray(cleanedCorrect)) {
        isCorrect = cleanedCorrect.includes(cleanedUser);
      } else {
        isCorrect = (cleanedUser === cleanedCorrect);
      }
    } else {
      isCorrect = (userAns === q.answer);
    }

    if (firstAttemptStatus[q.id] === undefined) {
      firstAttemptStatus[q.id] = isCorrect;
    }

    document.getElementById("feedback-result").classList.remove("hidden");
    const msgBox = document.getElementById("msg-feedback");
    const expBox = document.getElementById("msg-explanation");
    const btnNext = document.getElementById("btn-next");
    const lockMsg = document.getElementById("lock-msg");

    expBox.innerHTML = `💡 <b>교과서 원리 해설:</b><br>${q.explanation}`;

    if (isCorrect) {
      msgBox.className = "msg-box msg-success";
      msgBox.innerHTML = "🎉 <b>정답입니다! 통과하셨습니다.</b>";
      btnNext.classList.remove("hidden");
      lockMsg.classList.add("hidden");
      document.getElementById("btn-check").classList.add("hidden");
      if (q.type === "short") document.getElementById("short-input").disabled = true;
      btnNext.focus();
    } else {
      msgBox.className = "msg-box msg-error";
      msgBox.innerHTML = `❌ <b>오답입니다. 해설을 확인하고 정답을 맞춰 다음으로 이동하세요.</b> (입력한 답: ${userAns})`;
      btnNext.classList.add("hidden");
      lockMsg.classList.remove("hidden");
    }
  }

  function goToNextQuestion() {
    if (currentIndex < activeQuizList.length - 1) {
      currentIndex++;
      renderCurrentQuestion();
    } else {
      finishQuiz();
    }
  }

  // 4. 최종 결과 및 비동기 전송 ('2차시' 지정)
  function finishQuiz() {
    document.getElementById("screen-quiz").classList.add("hidden");
    document.getElementById("screen-result").classList.remove("hidden");

    wrongQuestions = activeQuizList.filter(q => firstAttemptStatus[q.id] === false);
    const totalCount = activeQuizList.length;
    const correctCount = totalCount - wrongQuestions.length;
    const wrongIdsStr = wrongQuestions.length > 0 ? wrongQuestions.map(q => q.id).join(", ") : "없음";

    document.getElementById("result-title").innerText = `🎉 ${studentName} 님, 2차시 평가 완료!`;
    document.getElementById("result-score").innerText = `첫 시도 정답: ${totalCount}문항 중 ${correctCount}개`;

    // 🚀 구글 시트 2차시 탭으로 백그라운드 전송 (화면 멈춤 없음)
    if (studentId && !sheetSubmitted && GOOGLE_SHEET_WEBAPP_URL.startsWith("https://script.google.com")) {
      sheetSubmitted = true;
      const payload = {
        sheet_name: SHEET_TAB_NAME,
        round: SHEET_TAB_NAME,
        student_id: studentId,
        student_name: studentName,
        score: correctCount,
        total: totalCount,
        wrong_questions: wrongIdsStr
      };

      fetch(GOOGLE_SHEET_WEBAPP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).catch(() => {});
    }

    renderResultTabs(correctCount, totalCount);
  }

  function renderResultTabs(correctCount, totalCount) {
    const wrongBox = document.getElementById("wrong-summary-box");
    const retryBtn = document.getElementById("btn-retry-wrong");

    if (wrongQuestions.length > 0) {
      wrongBox.innerHTML = `
        <h4 style="color: var(--error); margin-bottom: 8px;">⚠️ 처음 시도에서 틀렸던 문제가 <b>${wrongQuestions.length}개</b> 있습니다.</h4>
        <p style="font-size: 0.92rem; color: var(--text);">오답 문항 번호: <b>${wrongQuestions.map(q => `Q${q.id}`).join(", ")}</b></p>
      `;
      retryBtn.classList.remove("hidden");
    } else {
      wrongBox.innerHTML = `<h4 style="color: var(--success);">💯 첫 번째 시도에서 모든 문제를 완벽하게 맞혔습니다!</h4>`;
      retryBtn.classList.add("hidden");
    }

    // 37문항 전체 복습 리스트
    const allList = document.getElementById("all-questions-list");
    allList.innerHTML = "";
    let qNum = 1;
    for (const [cat, items] of Object.entries(RAW_QUIZ_DATA)) {
      items.forEach(q => {
        const itemDiv = document.createElement("div");
        itemDiv.style.marginBottom = "14px";
        const ansText = Array.isArray(q.answer) ? q.answer[0] : q.answer;
        itemDiv.innerHTML = `
          <p style="font-size: 0.95rem; margin-bottom: 6px;"><b>[${cat}] ${qNum}. ${q.question}</b></p>
          <details>
            <summary>Q${qNum} 정답 및 해설 확인</summary>
            <div style="margin-top: 8px; font-size: 0.9rem;">
              <p><b>정답:</b> <code style="background:#F1F5F9; padding:2px 6px; border-radius:4px;">${ansText}</code></p>
              <p style="margin-top: 4px; color: #166534;"><b>💡 해설:</b> ${q.explanation}</p>
            </div>
          </details>
          <hr style="border:0; border-top: 1px solid #E2E8F0; margin-top: 10px;">
        `;
        allList.appendChild(itemDiv);
        qNum++;
      });
    }
  }

  function startRetryWrong() {
    activeQuizList = [...wrongQuestions];
    currentIndex = 0;
    firstAttemptStatus = {};
    document.getElementById("screen-result").classList.add("hidden");
    document.getElementById("screen-quiz").classList.remove("hidden");
    renderCurrentQuestion();
  }

  function resetFullQuiz() {
    studentId = "";
    studentName = "";
    document.getElementById("s_id").value = "";
    document.getElementById("s_name").value = "";
    document.getElementById("screen-result").classList.add("hidden");
    document.getElementById("screen-intro").classList.remove("hidden");
  }

  function switchTab(idx) {
    const btns = document.querySelectorAll(".tab-btn");
    btns.forEach((b, i) => b.classList.toggle("active", i === idx - 1));
    document.getElementById("tab-content-1").classList.toggle("hidden", idx !== 1);
    document.getElementById("tab-content-2").classList.toggle("hidden", idx !== 2);
  }
</script>
</body>
</html>
